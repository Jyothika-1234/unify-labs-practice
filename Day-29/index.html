<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith CMS Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Zenith CMS</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">New Post</a>
            <button id="theme-toggle">Light</button>
        </div>
    </nav>

    <main class="container">
        <header class="content-header">
            <h1>Latest Posts</h1>
            <div class="filters">
                <input type="text" placeholder="Search title or category...">
                <select>
                    <option>All Categories</option>
                </select>
            </div>
        </header>

        <section class="posts-grid" id="posts-container">
            </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
