<div class="pet-card">
  <h1>Digital Pet</h1>
  <div class="status-box">
    <p>Name: <span id="petNameText">---</span></p>
    <p>Type: <span id="petTypeText">---</span></p>
    <div class="health-bar-container">
      <div id="healthBar" class="health-bar"></div>
    </div>
    <p>Health: <span id="healthText">100</span>%</p>
  </div>

  <div class="controls">
    <button onclick="uiFeed()">Feed 🍖</button>
    <button onclick="uiPlay()">Play 🎾</button>
  </div>
</div>
